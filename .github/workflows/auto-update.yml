name: ZP Package Update Bot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_bot.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-update package versions"
          title: "Bot: обновление версий пакетов"
          body: |
            Автоматическое обновление `.version` и `.url` в `pkgs/*/*.zon`
            на основе последних релизов апстрима.

            **Перед мержем проверь, что пакеты собираются.**
          branch: "bot/auto-updates"
          base: "main"
          delete-branch: true
