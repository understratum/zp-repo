name: ZP Package Update Bot

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Update Bot
        run: python3 scripts/update_bot.py

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: auto-update package versions"
          title: "Bot: Обновление версий пакетов"
          body: "Автоматическое обновление `.zon` файлов на основе последних релизов GitHub."
          branch: "bot/auto-updates"
          base: "main"
          delete-branch: true
